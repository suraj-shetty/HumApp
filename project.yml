# Xcode project definition for Hum. Generate with: xcodegen generate
#
# The generated HumApp.xcodeproj IS committed, so nothing here is required to
# open, build, or run the app. This file exists so build settings stay
# reviewable in a diff instead of buried in project.pbxproj. If you edit
# settings in Xcode's UI, mirror them here or the next `xcodegen generate`
# will revert them.

name: HumApp
options:
  bundleIdPrefix: com.hum
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"                    # Swift 6 language mode
    SWIFT_STRICT_CONCURRENCY: complete      # strict from day one, not retrofitted
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES     # acceptance criterion is "no warnings"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # OFF deliberately. The "Architectural containment checks" phase greps the
    # whole source tree; the script sandbox denies reads outside declared
    # inputs, and the set of files to check is not knowable in advance. Same
    # tradeoff any SwiftLint/codegen phase makes. Scoped to this project only —
    # no global Xcode setting is touched.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Hum:
    type: application
    platform: iOS
    sources:
      - path: Hum
        excludes: ["**/.gitkeep"]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.humapp
        PRODUCT_NAME: Hum
        INFOPLIST_FILE: Hum/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - script: '"$SRCROOT/Scripts/check-containment.sh"'
        name: "Architectural containment checks"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/containment-check-never-exists
    dependencies:
      - target: HumWatch
        embed: true
    # Embedding makes the `Hum` scheme's build depend on the watchOS platform
    # being installed — on a machine without it (this one, until this pass),
    # that fails the whole app's build, not just the watch app's. If that
    # happens again, drop back to no `dependencies:` here; `HumWatch` has its
    # own scheme and builds independently either way.

  # Board 03, Section 03 — relays through the paired iPhone rather than
  # talking to MusicKit independently (see
  # Hum/Services/WatchConnectivityRelayService.swift's own doc comment for
  # the reasoning). A modern single-target watch app: no separate WatchKit
  # Extension target.
  #
  # `sources` repeats the already framework-agnostic slice of `Hum/` this
  # target needs — `Domain/` (plain value types, already `Codable`),
  # `Reducers/` (pure, no I/O), and the two protocol-only Services files —
  # rather than extracting a Swift package for two targets. Nothing under
  # `Services/Adapters/` is listed, so this target never sees a MusicKit
  # import; `Scripts/check-containment.sh` scans it too (see that script).
  HumWatch:
    type: application
    platform: watchOS
    sources:
      - path: HumWatch
      - path: Hum/Domain
        excludes: ["**/.gitkeep"]
      - path: Hum/Reducers
        excludes: ["**/.gitkeep"]
      - path: Hum/Services/PlaybackService.swift
      - path: Hum/Services/SubscriptionService.swift
      - path: Hum/DesignSystem/Palette.swift
      - path: Hum/DesignSystem/HumIcons.swift
      - path: Hum/Features/Components/TimeFormatting.swift
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.humapp.watchkitapp
        PRODUCT_NAME: Hum
        INFOPLIST_FILE: HumWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  HumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HumTests
        excludes: ["**/.gitkeep"]
    dependencies:
      - target: Hum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.surajshetty.humapp.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  Hum:
    build:
      targets:
        Hum: all
        HumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HumTests

  HumWatch:
    build:
      targets:
        HumWatch: all
    run:
      config: Debug
